name: BOUNTY Dex builds
on:
  workflow_dispatch:
  push:
    paths:
      - 'bounty-dex/**'
      - '.github/workflows/bounty-dex-build.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: bounty-dex/android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: BOUNTY-Dex-Android-APK, path: bounty-dex/android/app/build/outputs/apk/debug/app-debug.apk, retention-days: 14 }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install dependencies
        run: pip install -r bounty-dex/windows/requirements.txt pyinstaller
      - name: Build EXE
        working-directory: bounty-dex/windows
        run: pyinstaller --noconfirm --clean --onefile --windowed --name BOUNTY-Dex bounty_dex.py
      - uses: actions/upload-artifact@v4
        with: { name: BOUNTY-Dex-Windows, path: bounty-dex/windows/dist/BOUNTY-Dex.exe, retention-days: 14 }
