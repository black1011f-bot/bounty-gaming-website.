name: BOUNTY Dex builds

on:
  workflow_dispatch:
  push:
    paths:
      - 'bounty-dex/**'
      - '.github/workflows/bounty-dex-build.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: src/bounty-dex/android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BOUNTY-Dex-Android-APK
          path: src/bounty-dex/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      # This repo name ends in a dot. Windows cannot create the default GITHUB_WORKSPACE path.
      # Clone into D:\a\src instead of using actions/checkout on this runner.
      - name: Get source in a Windows-safe folder
        shell: pwsh
        working-directory: D:\a
        run: |
          if (Test-Path 'D:\a\src') { Remove-Item 'D:\a\src' -Recurse -Force }
          git clone --depth 1 'https://github.com/black1011f-bot/bounty-gaming-website..git' 'D:\a\src'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: pwsh
        working-directory: D:\a\src\bounty-dex\windows
        run: pip install -r requirements.txt pyinstaller
      - name: Build EXE
        shell: pwsh
        working-directory: D:\a\src\bounty-dex\windows
        run: pyinstaller --noconfirm --clean --onefile --windowed --name BOUNTY-Dex bounty_dex.py
      - uses: actions/upload-artifact@v4
        with:
          name: BOUNTY-Dex-Windows
          path: D:\a\src\bounty-dex\windows\dist\BOUNTY-Dex.exe
          if-no-files-found: error
          retention-days: 14
