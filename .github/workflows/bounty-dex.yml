name: BOUNTY Dex builds

on:
  workflow_dispatch:
  push:
    paths:
      - "bounty-dex/**"
      - ".github/workflows/bounty-dex.yml"

jobs:
  windows:
    name: Windows desktop package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bounty-dex/windows/requirements.txt

      - name: Build desktop executable
        working-directory: bounty-dex/windows
        run: pyinstaller --noconfirm --clean --onefile --windowed --name BOUNTY-Dex bounty_dex.py

      - name: Download Android Platform Tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "bounty-dex/windows/dist/BOUNTY-Dex/tools/platform-tools" | Out-Null
          Invoke-WebRequest "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "$env:RUNNER_TEMP/platform-tools.zip"
          Expand-Archive "$env:RUNNER_TEMP/platform-tools.zip" "$env:RUNNER_TEMP/platform-tools" -Force
          Copy-Item "$env:RUNNER_TEMP/platform-tools/platform-tools/*" "bounty-dex/windows/dist/BOUNTY-Dex/tools/platform-tools/" -Recurse -Force

      - name: Download complete scrcpy Windows release
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/Genymobile/scrcpy/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match '^scrcpy-win64-.*\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "Could not find the official scrcpy win64 ZIP asset." }
          Invoke-WebRequest $asset.browser_download_url -OutFile "$env:RUNNER_TEMP/scrcpy.zip"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/scrcpy-extract" | Out-Null
          Expand-Archive "$env:RUNNER_TEMP/scrcpy.zip" "$env:RUNNER_TEMP/scrcpy-extract" -Force
          $folder = Get-ChildItem "$env:RUNNER_TEMP/scrcpy-extract" -Directory | Select-Object -First 1
          if (-not $folder) { throw "scrcpy archive did not contain its expected folder." }
          New-Item -ItemType Directory -Force "bounty-dex/windows/dist/BOUNTY-Dex/tools/scrcpy" | Out-Null
          Copy-Item "$($folder.FullName)/*" "bounty-dex/windows/dist/BOUNTY-Dex/tools/scrcpy/" -Recurse -Force

      - name: Assemble portable package
        shell: pwsh
        run: |
          Copy-Item "bounty-dex/windows/dist/BOUNTY-Dex.exe" "bounty-dex/windows/dist/BOUNTY-Dex/BOUNTY-Dex.exe"
          Compress-Archive -Path "bounty-dex/windows/dist/BOUNTY-Dex/*" -DestinationPath "bounty-dex/windows/dist/BOUNTY-Dex-Windows.zip" -Force
          $size = (Get-Item "bounty-dex/windows/dist/BOUNTY-Dex-Windows.zip").Length
          Write-Host "Portable package size: $size bytes (includes ADB + scrcpy)"
          if ($size -lt 20MB) { Write-Warning "Package is unexpectedly small; verify bundled ADB and scrcpy contents." }

      - uses: actions/upload-artifact@v4
        with:
          name: BOUNTY-Dex-Windows
          path: bounty-dex/windows/dist/BOUNTY-Dex-Windows.zip
          if-no-files-found: error
          compression-level: 0

  android:
    name: Android companion APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: bounty-dex/android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BOUNTY-Dex-Android-APK
          path: bounty-dex/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
