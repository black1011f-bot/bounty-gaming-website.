name: BOUNTY Dex builds

on:
  workflow_dispatch:
  push:
    paths:
      - "bounty-dex/**"
      - ".github/workflows/bounty-dex.yml"

permissions:
  contents: write

jobs:
  windows:
    name: Windows desktop package
    runs-on: windows-latest
    steps:
      # The repository name ends with a dot, which is invalid in a Windows
      # workspace path. Clone it into a safe temporary directory instead.
      - name: Clone source into a Windows-safe path
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch "${{ github.ref_name }}" "$env:GITHUB_SERVER_URL/${{ github.repository }}.git" "$env:RUNNER_TEMP/source"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source/bounty-dex/windows/requirements.txt

      - name: Build desktop executable
        working-directory: ${{ runner.temp }}/source/bounty-dex/windows
        run: pyinstaller --noconfirm --clean --onefile --windowed --name BOUNTY-Dex bounty_dex.py

      - name: Download Android Platform Tools
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          New-Item -ItemType Directory -Force "source/bounty-dex/windows/dist/BOUNTY-Dex/tools/platform-tools" | Out-Null
          Invoke-WebRequest "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "$env:RUNNER_TEMP/platform-tools.zip"
          Expand-Archive "$env:RUNNER_TEMP/platform-tools.zip" "$env:RUNNER_TEMP/platform-tools" -Force
          Copy-Item "$env:RUNNER_TEMP/platform-tools/platform-tools/*" "source/bounty-dex/windows/dist/BOUNTY-Dex/tools/platform-tools/" -Recurse -Force

      - name: Download complete scrcpy Windows release
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/Genymobile/scrcpy/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match '^scrcpy-win64-.*\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "Could not find the official scrcpy win64 ZIP asset." }
          Invoke-WebRequest $asset.browser_download_url -OutFile "$env:RUNNER_TEMP/scrcpy.zip"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/scrcpy-extract" | Out-Null
          Expand-Archive "$env:RUNNER_TEMP/scrcpy.zip" "$env:RUNNER_TEMP/scrcpy-extract" -Force
          $folder = Get-ChildItem "$env:RUNNER_TEMP/scrcpy-extract" -Directory | Select-Object -First 1
          if (-not $folder) { throw "scrcpy archive did not contain its expected folder." }
          New-Item -ItemType Directory -Force "source/bounty-dex/windows/dist/BOUNTY-Dex/tools/scrcpy" | Out-Null
          Copy-Item "$($folder.FullName)/*" "source/bounty-dex/windows/dist/BOUNTY-Dex/tools/scrcpy/" -Recurse -Force

      - name: Assemble portable package
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Copy-Item "source/bounty-dex/windows/dist/BOUNTY-Dex.exe" "source/bounty-dex/windows/dist/BOUNTY-Dex/BOUNTY-Dex.exe"
          @'
          import pathlib, zipfile
          root = pathlib.Path("source/bounty-dex/windows/dist/BOUNTY-Dex")
          archive = pathlib.Path("source/bounty-dex/windows/dist/BOUNTY-Dex-Windows.zip")
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_STORED) as z:
              for file in root.rglob("*"):
                  if file.is_file():
                      z.write(file, file.relative_to(root.parent))
          size = archive.stat().st_size
          print(f"Portable package size: {size} bytes (includes ADB + scrcpy)")
          if size < 50 * 1024 * 1024:
              raise SystemExit("Portable package is below the requested 50 MiB minimum; check bundled dependencies.")
          '@ | python -

      - uses: actions/upload-artifact@v4
        with:
          name: BOUNTY-Dex-Windows
          path: ${{ runner.temp }}/source/bounty-dex/windows/dist/BOUNTY-Dex-Windows.zip
          if-no-files-found: error
          compression-level: 0

  android:
    name: Android companion APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android APK
        working-directory: source/bounty-dex/android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BOUNTY-Dex-Android
          path: source/bounty-dex/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish:
    name: Publish Windows and Android downloads
    runs-on: ubuntu-latest
    needs: [windows, android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: BOUNTY-Dex-*
          path: release-files
          merge-multiple: true
      - name: Prepare release assets
        run: |
          mv release-files/app-debug.apk release-files/BOUNTY-Dex-Android.apk
          test -s release-files/BOUNTY-Dex-Windows.zip
          test -s release-files/BOUNTY-Dex-Android.apk
      - name: Publish downloads to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bounty-dex-latest
          name: BOUNTY Dex — Latest builds
          prerelease: true
          make_latest: false
          files: |
            release-files/BOUNTY-Dex-Windows.zip
            release-files/BOUNTY-Dex-Android.apk
          overwrite_files: true
          fail_on_unmatched_files: true
