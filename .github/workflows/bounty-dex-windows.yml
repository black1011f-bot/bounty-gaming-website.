name: Build BOUNTY Dex for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'bounty-dex/windows/**'
      - '.github/workflows/bounty-dex-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bounty-dex/windows/requirements.txt pyinstaller
      - name: Package application
        working-directory: bounty-dex/windows
        run: |
          pyinstaller --noconfirm --clean --windowed --name BOUNTY-Dex --collect-all PySide6 bounty_dex.py
      - name: Zip Windows build
        run: Compress-Archive -Path bounty-dex/windows/dist/BOUNTY-Dex -DestinationPath BOUNTY-Dex-Windows.zip
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: BOUNTY-Dex-Windows
          path: BOUNTY-Dex-Windows.zip
          if-no-files-found: error
          retention-days: 30
