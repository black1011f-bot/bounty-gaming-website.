name: Build BOUNTY Dex Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'bounty-dex/android/**'
      - '.github/workflows/bounty-dex-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: bounty-dex/android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOUNTY-Dex-Android-APK
          path: bounty-dex/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
